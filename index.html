<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y214 Probe</title>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
  :root { --void:#0b1320; --text:#e8f1ff; --muted:#8aa0c0; --primary:#00c2d1; --warn:#ffd166; --rec:#ff5d5d; }
  html,body { margin:0; height:100%; background:var(--void); color:var(--text); font-family:monospace; }
  header { padding:1.2vw 2vw; font-size:2.6vw; } header b { color:var(--primary); }
  #banner { padding:0 2vw; font-size:2.8vw; color:var(--warn); min-height:7vw; }
  #banner.rec { color:var(--rec); }
  #log { white-space:pre-wrap; padding:1vw 2vw; font-size:1.5vw; line-height:1.35; color:var(--muted); }
</style>
</head>
<body>
<header>Y214 <b>Probe</b> v1.0.2 — microphone test</header>
<div id="banner">starting…</div>
<div id="log"></div>
<script>
// Tests EVERY audio input the TV exposes (the TV's built-in mic and the remote's mic) for 6 s each, reports levels per second
// and uploads the recording (16 kHz mono PCM) to the receiver on the XPS laptop so we can transcribe it with HA's Whisper.
var RECV = 'http://192.168.3.96:8099/probe';
var logEl = document.getElementById('log'), banner = document.getElementById('banner');
function show(t) { logEl.textContent += t + '\n'; }
function say(t, rec) { banner.textContent = t; banner.className = rec ? 'rec' : ''; }
function post(section, data) {
  var body = JSON.stringify({ section: section, data: data });
  try { fetch(RECV, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: body }).catch(function (e) { show('POST failed [' + section + ']: ' + e); }); }
  catch (e) { show('POST exception [' + section + ']: ' + e); }
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

// Remote-mic diagnosis: does the track ever unmute / carry samples while the MIC button is pressed? which key events does the app see?
async function remoteDiag(deviceId, seconds) {
  var ev = [], t0 = Date.now(), ts = function () { return ((Date.now() - t0) / 1000).toFixed(1) + 's '; };
  var stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: deviceId }, echoCancellation: false, autoGainControl: false, noiseSuppression: false } });
  var track = stream.getAudioTracks()[0];
  ev.push(ts() + 'start muted=' + track.muted + ' state=' + track.readyState + ' enabled=' + track.enabled);
  track.onmute = function () { ev.push(ts() + 'MUTE'); }; track.onunmute = function () { ev.push(ts() + 'UNMUTE'); }; track.onended = function () { ev.push(ts() + 'ENDED'); };
  var keyH = function (e) { ev.push(ts() + 'key ' + e.type + ' code=' + e.keyCode + ' key=' + (e.key || '')); };
  document.addEventListener('keydown', keyH); document.addEventListener('keyup', keyH);
  var Ctx = window.AudioContext || window.webkitAudioContext, ctx = new Ctx(), src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser(); an.fftSize = 1024; src.connect(an);
  var buf = new Uint8Array(an.fftSize), max = 0, firstAt = null, t1 = Date.now();
  while (Date.now() - t1 < seconds * 1000) {
    an.getByteTimeDomainData(buf); var s = 0; for (var k = 0; k < buf.length; k++) { var v = (buf[k] - 128) / 128; s += v * v; }
    var rms = Math.sqrt(s / buf.length); if (rms > max) max = rms; if (rms > 0.0005 && firstAt === null) { firstAt = ts(); ev.push(firstAt + 'first signal rms=' + rms.toFixed(4)); } await sleep(50);
  }
  document.removeEventListener('keydown', keyH); document.removeEventListener('keyup', keyH);
  stream.getTracks().forEach(function (t) { t.stop(); }); try { ctx.close(); } catch (e) {}
  var keys = 'n/a'; try { keys = tizen.tvinputdevice.getSupportedKeys().map(function (k) { return k.name; }).join(','); } catch (e) { keys = 'ERR ' + e; }
  return { events: ev, maxRms: +max.toFixed(5), supportedKeys: keys };
}

async function recordDevice(deviceId, seconds, constraints) {
  var stream = await navigator.mediaDevices.getUserMedia({ audio: Object.assign({ deviceId: { exact: deviceId } }, constraints || {}) });
  var track = stream.getAudioTracks()[0];
  var Ctx = window.AudioContext || window.webkitAudioContext, ctx = new Ctx();
  var src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1);
  var chunks = [], total = 0;
  proc.onaudioprocess = function (e) { var d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d)); total += d.length; };
  src.connect(proc); proc.connect(ctx.destination);
  await sleep(seconds * 1000);
  proc.disconnect(); src.disconnect(); var settings = track.getSettings ? track.getSettings() : null; stream.getTracks().forEach(function (t) { t.stop(); });
  var sr = ctx.sampleRate; try { ctx.close(); } catch (e) {}
  var all = new Float32Array(total), off = 0; chunks.forEach(function (c) { all.set(c, off); off += c.length; });
  var rmsPerSec = [], peak = 0;
  for (var i = 0; i < all.length; i += sr) { var s = 0, n = 0; for (var j = i; j < Math.min(i + sr, all.length); j++) { s += all[j] * all[j]; n++; if (Math.abs(all[j]) > peak) peak = Math.abs(all[j]); } rmsPerSec.push(+Math.sqrt(s / Math.max(n, 1)).toFixed(4)); }
  var ratio = sr / 16000, outLen = Math.floor(all.length / ratio), pcm = new Int16Array(outLen);
  for (var k = 0; k < outLen; k++) { var pos = k * ratio, i0 = Math.floor(pos), i1 = Math.min(i0 + 1, all.length - 1), fr = pos - i0; var v = all[i0] * (1 - fr) + all[i1] * fr; v = Math.max(-1, Math.min(1, v)); pcm[k] = v < 0 ? v * 32768 : v * 32767; }
  var bytes = new Uint8Array(pcm.buffer), bin = '';
  for (var b = 0; b < bytes.length; b += 0x8000) { bin += String.fromCharCode.apply(null, bytes.subarray(b, b + 0x8000)); }
  return { settings: settings, sampleRate: sr, seconds: seconds, samples: total, rmsPerSec: rmsPerSec, peak: +peak.toFixed(4), pcm16k_b64: btoa(bin) };
}

async function run() {
  post('hello', { t: new Date().toISOString(), version: '1.0.1' });
  var devices = [];
  try { await navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) { s.getTracks().forEach(function (t) { t.stop(); }); }); devices = (await navigator.mediaDevices.enumerateDevices()).filter(function (d) { return d.kind === 'audioinput'; }); }
  catch (e) { say('getUserMedia failed: ' + e); post('mic.fail', String(e)); return; }
  show('audio inputs: ' + devices.map(function (d) { return d.label || d.deviceId.slice(0, 8); }).join(' | '));
  post('mic.devices', devices.map(function (d) { return { label: d.label, id: d.deviceId.slice(0, 12) }; }));
  var builtin = devices.filter(function (d) { return !/remote/i.test(d.label); })[0], remote = devices.filter(function (d) { return /remote/i.test(d.label); })[0];
  var plan = [
    { name: 'builtin-normal', dev: builtin, how: 'Say CLEARLY, from where you sit, in a NORMAL voice:\n"turn on the living room light"', secs: 6 },
    { name: 'builtin-loud',   dev: builtin, how: 'Say it again, LOUD and clear:\n"turn on the living room light"', secs: 6 },
    { name: 'remote-diag',    dev: remote,  how: 'Hold the MIC button on the remote for 3 s while TALKING,\nrelease, wait 2 s, then hold again for 3 s', secs: 12, diag: true }
  ];
  for (var i = 0; i < plan.length; i++) {
    var p = plan[i]; if (!p.dev) { show('[' + p.name + '] input not found'); post('mic.result.' + p.name, { error: 'input not found' }); continue; }
    for (var c = 5; c >= 1; c--) { say('Test ' + (i + 1) + '/' + plan.length + ' (' + p.dev.label + ')\n' + p.how + '\nstarting in ' + c + ' s'); await sleep(1000); }
    say('RECORDING — ' + p.how.split('\n')[0], true);
    try {
      if (p.diag) { var dg = await remoteDiag(p.dev.deviceId, p.secs); show('[' + p.name + '] maxRms ' + dg.maxRms + ' events: ' + dg.events.join(' | ')); post('mic.result.' + p.name, dg); }
      else {
        var r = await recordDevice(p.dev.deviceId, p.secs); var audio = r.pcm16k_b64; delete r.pcm16k_b64;
        r.label = p.dev.label; show('[' + p.name + '] rms/s ' + JSON.stringify(r.rmsPerSec) + ' peak ' + r.peak);
        post('mic.result.' + p.name, r); post('mic.audio.' + p.name, { label: p.dev.label, rate: 16000, pcm16_b64: audio });
      }
    } catch (e) { show('[' + p.name + '] FAILED ' + e); post('mic.result.' + p.name, { error: String(e) }); }
  }
  say('Done — report sent to the laptop. Press Return to exit.');
  post('done', { t: new Date().toISOString() });
}
run().catch(function (e) { say('Crashed: ' + e); post('crash', String(e)); });
</script>
</body>
</html>
